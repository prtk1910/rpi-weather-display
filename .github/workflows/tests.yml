name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: python -m weather_display.preview --output /tmp/dashboard.png
      - run: test "$(file -b /tmp/dashboard.png)" = "PNG image data, 480 x 320, 8-bit/color RGB, non-interlaced"
      - run: bash -n scripts/install.sh
