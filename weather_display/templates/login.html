<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Display Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="narrow"><h1>Weather Display</h1><p>Enter the display PIN to manage settings.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>PIN<input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required autofocus></label><button>Sign in</button></form></main></body></html>
