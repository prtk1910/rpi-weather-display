<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weather Display Settings</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body><main>
  <div class="head"><div><h1>Weather Display</h1><p>Changes appear on the display immediately.</p></div><button class="link" id="logout">Sign out</button></div>
  <form id="settings">
    <label>Location<input id="search" value="{{ settings.location_label }}" autocomplete="off" required><div id="results" class="results"></div></label>
    <div class="coords">
      <label>Latitude<input id="latitude" type="number" step="any" value="{{ settings.latitude }}" required></label>
      <label>Longitude<input id="longitude" type="number" step="any" value="{{ settings.longitude }}" required></label>
    </div>
    <label>Timezone<input id="timezone" value="{{ settings.timezone }}" required></label>
    <div class="coords">
      <label>Weather display time<input id="weather-seconds" type="number" min="5" max="300" step="1" value="{{ settings.weather_scene_seconds }}" required><small>seconds (5–300)</small></label>
      <label>Events display time<input id="events-seconds" type="number" min="5" max="300" step="1" value="{{ settings.events_scene_seconds }}" required><small>seconds (5–300)</small></label>
    </div>
    <fieldset><legend>Event categories</legend><p class="hint">Selected categories are shown first. Other events fill open spots.</p><div class="category-grid">
      {% for category in event_categories %}<label class="choice"><input type="checkbox" name="event_categories" value="{{ category }}" {% if category in settings.event_categories %}checked{% endif %}> {{ category }}</label>{% endfor %}
    </div></fieldset>
    <fieldset><legend>Units</legend>
      <label class="choice"><input type="radio" name="units" value="metric" {% if settings.units == 'metric' %}checked{% endif %}> Celsius and km/h</label>
      <label class="choice"><input type="radio" name="units" value="imperial" {% if settings.units == 'imperial' %}checked{% endif %}> Fahrenheit and mph</label>
    </fieldset>
    <fieldset><legend>Clock</legend>
      <label class="choice"><input type="radio" name="clock" value="24h" {% if settings.clock_format == '24h' %}checked{% endif %}> 24 hour</label>
      <label class="choice"><input type="radio" name="clock" value="12h" {% if settings.clock_format == '12h' %}checked{% endif %}> 12 hour</label>
    </fieldset>
    <div class="form-actions"><button type="submit">Save settings</button><button type="button" class="secondary compact" id="toggle-display">Switch display now</button></div><p id="status" aria-live="polite"></p>
  </form>
</main><script>window.CSRF={{ csrf|tojson }};</script><script src="{{ url_for('static', filename='settings.js') }}"></script></body>
</html>
